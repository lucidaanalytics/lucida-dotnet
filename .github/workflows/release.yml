name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_NUGET: ${{ secrets.NUGET_API_KEY != '' }}
    permissions:
      contents: write
      id-token: write # attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet pack src/Lucida -c Release -o nupkgs && dotnet pack src/Lucida.AspNetCore -c Release -o nupkgs && dotnet pack src/Lucida.OpenFeature -c Release -o nupkgs
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: nupkgs/*.nupkg
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" nupkgs/*.nupkg --generate-notes --verify-tag
      # NuGet publish runs only when the NUGET_API_KEY repository secret is set.
      - name: Publish to NuGet
        if: env.HAS_NUGET == 'true'
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
